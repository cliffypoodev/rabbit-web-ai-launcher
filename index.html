<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Apps</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#080808;color:#f5f5f2;font-family:Arial,sans-serif}
body{padding:12px;overflow-x:hidden}
h1{font-size:29px;line-height:1;margin:2px 0 6px}
.sub{margin:0 0 13px;color:#9b9b96;font:9px/1.3 monospace}
.launch{width:100%;min-height:126px;border:1px solid #ff5f00;border-radius:12px;background:#1b1b1b;color:#fff;padding:16px 12px;text-align:center}
.launch strong{display:block;font-size:25px;line-height:1.05}
.launch span{display:block;margin-top:10px;color:#6bcb77;font:9px monospace}
#status{height:23px;padding-top:7px;color:#ff5f00;text-align:center;font:9px monospace}
details{margin-top:5px;border-top:1px solid #272727;padding-top:7px}
summary{color:#9b9b96;font:9px monospace;cursor:pointer}
.grid{display:grid;gap:5px;margin-top:7px}
.grid a{display:block;border:1px solid #303030;border-radius:8px;background:#151515;color:#eee;text-decoration:none;padding:7px 9px;font:bold 12px Arial,sans-serif}
.grid small{display:block;margin-top:2px;color:#8e8e89;font:8px monospace}
</style>
</head>
<body>
<h1>AI APPS</h1>
<p class="sub">Rabbit launcher · native first</p>

<button class="launch" onclick="signalLaunch()">
  <strong>Open AI Apps</strong>
  <span>ChatGPT + Claude native · web fallback for the rest</span>
</button>
<div id="status">opening launcher…</div>

<details>
  <summary>web fallback</summary>
  <div class="grid">
    <a href="https://chatgpt.com/">ChatGPT<small>OpenAI</small></a>
    <a href="https://claude.ai/new">Claude<small>Anthropic</small></a>
    <a href="https://gemini.google.com/app">Gemini<small>Google</small></a>
    <a href="https://chat.deepseek.com/">DeepSeek<small>DeepSeek</small></a>
    <a href="https://qwen.ai/">Qwen<small>Alibaba</small></a>
  </div>
</details>

<script>
function signalLaunch(){
  const token='RABBIT_AI_APPS_LAUNCH_'+Date.now();
  try{
    localStorage.setItem('rabbit_aiapps_launch',token);
    document.getElementById('status').textContent='opening AI Apps…';
  }catch(e){
    document.getElementById('status').textContent='tap a web fallback below';
  }
}
window.addEventListener('load',()=>{
  if(sessionStorage.getItem('rabbit_aiapps_autolaunched')!=='1'){
    sessionStorage.setItem('rabbit_aiapps_autolaunched','1');
    setTimeout(signalLaunch,350);
  }else{
    document.getElementById('status').textContent='tap Open AI Apps to reopen';
  }
});
</script>
</body>
</html>
