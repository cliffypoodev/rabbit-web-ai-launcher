<body>
<main class="app" id="app">
  <section id="library" class="view on" aria-label="Notes library">
    <header class="top"><button class="icon" id="folders" aria-label="Folders and settings" data-icon="menu"></button><h1 id="libTitle">All notes</h1><button class="icon" id="search" aria-label="Search notes" data-icon="search"></button></header>
    <div class="filters" aria-label="Filter notes"><button class="filter selected" data-filter="all">All</button><button class="filter" data-filter="meetings">Recordings</button><button class="filter" data-filter="pinned">Pinned</button><button class="filter" data-filter="attention">Needs attention</button></div>
    <div class="list scroll" id="list"></div>
    <footer class="capturebar"><button id="meetingNew" class="recordButton"><span class="recordSymbol"></span>Record</button><button id="new" class="newButton"><span data-icon="plus"></span>New note</button></footer>
  </section>
  <section id="searchView" class="view" aria-label="Search notes">
    <header class="top"><button class="icon" id="searchBack" aria-label="Back to notes" data-icon="back"></button><input id="q" type="search" placeholder="Search all note content" autocomplete="off" aria-label="Search all note content"></header><div id="results" class="list scroll"></div>
  </section>
  <section id="editor" class="view" aria-label="Note detail">
    <header class="top"><button class="icon" id="back" aria-label="Back to notes" data-icon="back"></button><div class="saveState" id="saveState" aria-live="polite">Saved</div><span class="topSpacer"></span><button class="icon" id="keyboard" aria-label="Type a note" data-icon="keyboard"></button><button class="icon" id="more" aria-label="Note options" data-icon="more"></button></header>
    <div id="recordBanner" class="recordBanner" hidden><span class="recordSymbol"></span><span id="recordState">Recording</span><time id="recordClock">00:00</time></div>
    <div class="detailHead"><input id="noteTitle" class="noteTitle" placeholder="Untitled note" aria-label="Note title" autocomplete="off" inputmode="none" readonly><div id="noteMeta" class="noteMeta"></div></div>
    <div class="sectionBar"><label class="srOnly" for="sectionSelect">Note section</label><select id="sectionSelect"><option value="summary">Summary</option><option value="transcript">Transcript</option><option value="notes">My notes</option><option value="ask">Ask this note</option><option value="highlights">Highlights</option><option value="outline">Outline</option></select><button class="textButton" id="sectionAction">Generate</button></div>
    <div id="editScroll" class="detailContent scroll">
      <div id="summaryPane"></div><div id="transcriptPane" hidden></div>
      <div id="notesPane" hidden><div id="body" class="noteBody" role="textbox" aria-label="Personal notes" aria-multiline="true" contenteditable="false" tabindex="0" data-placeholder="Tap Dictate for push-to-talk, or use the keyboard."></div></div>
      <div id="askPane" hidden></div><div id="highlightsPane" hidden></div><div id="outlinePane" hidden></div>
    </div>
    <div id="player" class="player" hidden><div class="playerButtons"><button id="rewind" class="playerButton" aria-label="Back 15 seconds">−15</button><button id="play" class="playerButton playButton" aria-label="Play audio" data-icon="play"></button><button id="forward" class="playerButton" aria-label="Forward 15 seconds">+15</button><time id="playTime">00:00</time><select id="playSpeed" aria-label="Playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></div><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Audio position"></div>
    <footer id="recordControls" class="recordControls" hidden><button id="mark" class="controlButton"><span data-icon="flag"></span>Mark</button><button id="pause" class="controlButton">Pause</button><button id="stop" class="controlButton stopButton"><span data-icon="stop"></span>Stop</button></footer>
  </section>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="sheet" class="sheet scroll" hidden role="dialog" aria-modal="true" aria-label="Options"><header class="sheetHead"><h2 id="sheetTitle">Options</h2><button id="closeSheet" class="icon" aria-label="Close options" data-icon="close"></button></header><div id="sheetBody"></div></aside>
  <section id="dialog" class="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><header class="sheetHead"><h2 id="dialogTitle"></h2><button id="dialogClose" class="icon" aria-label="Cancel" data-icon="close"></button></header><div id="dialogBody" class="dialogBody scroll"></div><footer class="dialogActions"><button id="dialogCancel" class="button">Cancel</button><button id="dialogOk" class="button primary">Save</button></footer></section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="audioImport" type="file" accept="audio/*,.webm,.m4a,.mp3,.wav,.ogg,.mp4" hidden><input id="backupImport" type="file" accept="application/json,.json" hidden>
  <audio id="audio" preload="metadata"></audio>
</main>
<script>/* R1 Notes durable storage. This module deliberately contains no network calls. */
(function (root) {
  "use strict";

  const keys = Object.freeze({
    index: "r1notes:index:v2",
    folders: "r1notes:folders:v2",
    settings: "r1notes:settings:v2",
    outbox: "r1notes:outbox:v1",
    conversations: "r1notes:conversations:v1",
    journal: "r1notes:journal:v1",
    recoveryErrors: "r1notes:recovery-errors:v1",
    note: id => "r1notes:note:" + id,
    prev: id => "r1notes:note:" + id + ":prev",
    pending: id => "r1notes:note:" + id + ":pending",
    conv: id => "r1notes:conversation:" + id
  });
  let tail = Promise.resolve();
  let operationSequence = 0;

  const fallback = {
    getItem: key => root.localStorage.getItem(key),
    setItem: (key, value) => root.localStorage.setItem(key, value),
    removeItem: key => root.localStorage.removeItem(key)
  };

  function area() {
    const plain = root.creationStorage && root.creationStorage.plain;
    return plain && typeof plain.getItem === "function" ? plain : fallback;
  }

  // A failed mutation rejects its own caller, but does not poison later work.
  // Reads also join this queue, so callers see all preceding mutations.
  function serial(work) {
    const result = tail.then(() => work(area()));
    tail = result.catch(() => undefined);
    return result;
  }

  function snapshot(value) {
    const serialized = JSON.stringify(value);
    if (serialized === undefined) throw new TypeError("Storage value is not JSON serializable");
    return JSON.parse(serialized);
  }

  function encode(value) {
    return root.btoa(unescape(encodeURIComponent(JSON.stringify(value))));
  }

  function corrupt(key, message) {
    const error = new Error("Stored data could not be read: " + key + (message ? " (" + message + ")" : ""));
    error.name = "R1StorageCorruptionError";
    error.code = "R1_STORAGE_CORRUPT";
    error.key = key;
    return error;
  }

  function decode(raw, key) {
    if (raw === null || raw === undefined || raw === "") return null;
    try {
      return JSON.parse(decodeURIComponent(escape(root.atob(raw))));
    } catch (_) {
      try { return JSON.parse(raw); }
      catch (error) { throw corrupt(key, "invalid encoded JSON"); }
    }
  }

  async function read(storage, key) { return decode(await storage.getItem(key), key); }
  async function write(storage, key, value) { await storage.setItem(key, encode(value)); }
  async function erase(storage, key) { await storage.removeItem(key); }

  function requireId(id) {
    if (typeof id !== "string" || !id.trim()) throw new TypeError("A nonempty record ID is required");
    return id;
  }

  function isNote(value, id) {
    return !!value && typeof value === "object" && !Array.isArray(value) && value.id === id;
  }

  function noteSnapshot(note) {
    if (!note || typeof note !== "object" || Array.isArray(note)) throw new TypeError("A note object is required");
    requireId(note.id);
    return snapshot(note);
  }

  async function readIndex(storage) {
    const value = await read(storage, keys.index);
    if (value === null) return [];
    if (!Array.isArray(value) || value.some(item => !item || typeof item.id !== "string" || !item.id.trim())) {
      throw corrupt(keys.index, "invalid note index");
    }
    return value;
  }

  async function readJournal(storage) {
    const value = await read(storage, keys.journal);
    if (value === null) return [];
    if (!Array.isArray(value)) throw corrupt(keys.journal, "invalid save journal");
    return value.map(item => {
      const entry = typeof item === "string" ? { id: item } : item;
      if (!entry || typeof entry.id !== "string" || !entry.id.trim()) throw corrupt(keys.journal, "invalid journal entry");
      return entry;
    });
  }

  function register(journal, note) {
    const entry = { id: note.id, note: snapshot(note), registeredAt: Date.now() };
    return journal.filter(item => item.id !== note.id).concat(entry);
  }

  function indexEntry(note, metadataFn, old) {
    if (typeof metadataFn !== "function") throw new TypeError("A note metadata function is required");
    const computed = metadataFn(snapshot(note));
    if (!computed || typeof computed !== "object" || Array.isArray(computed)) throw new TypeError("Note metadata must be an object");
    const entry = Object.assign({}, old || {}, snapshot(computed), { id: note.id });
    delete entry.recoveryError;
    delete entry.recoveryStatus;
    return entry;
  }

  function mergeIndex(index, entry) {
    const exists = index.some(item => item.id === entry.id);
    if (!exists) return [entry].concat(index);
    let used = false;
    return index.filter(item => {
      if (item.id !== entry.id) return true;
      if (used) return false;
      used = true;
      return true;
    }).map(item => item.id === entry.id ? entry : item);
  }

  async function noteRecord(storage, key, id) {
    let value;
    try { value = await read(storage, key); }
    catch (error) {
      if (error.code !== "R1_STORAGE_CORRUPT") throw error;
      return { value: null, found: true, error: error.message };
    }
    if (value === null) return { value: null, found: false, error: null };
    if (!isNote(value, id)) return { value: null, found: true, error: "Stored note has an invalid or mismatched ID" };
    return { value, found: true, error: null };
  }

  async function finishJournal(storage, journal) {
    if (journal.length) await write(storage, keys.journal, journal);
    else await erase(storage, keys.journal);
  }

    if (root.crypto && typeof root.crypto.randomUUID === "function") return "op-" + root.crypto.randomUUID();

    return "op-" + Date.now() + "-" + operationSequence + "-" + Math.random().toString(16).slice(2);

  async function readOutbox(storage) {

  }

  }

    get: key => serial(storage => read(storage, key)),
    set,
    remove: key => serial(storage => erase(storage, key)),
    saveNote,
    recover,
    enqueue,
    pendingOps,
    acknowledge,
    updateOp,
    saveFolders,
    keys
  });

async function flushOps(){
 for(let pass=0;pass<250;pass++){
  const pending=await Store.pendingOps();let op=pending.find(x=>!x.conflict&&!['finish','generate','ask'].includes(x.kind)&&!pending.some(y=>y.conflict&&y.note_id&&y.note_id===x.note_id));if(!op)return;
  let ids=[op.op_id],prepared;
  if(op.kind==='note'){const group=pending.filter(x=>x.kind==='note'&&x.note_id===op.note_id&&!x.conflict);op=group[group.length-1];ids=group.map(x=>x.op_id)}
  try{
   let result;
   if(op.kind==='note'){prepared=await prepareNoteWrite(op);if(!prepared)continue;result=prepared.existing||await api(op.path,{method:'PUT',body:prepared.body})}
   else if(op.kind==='edit'){
    const p=await api('/v1/notes/'+encodeURIComponent(op.note_id)),current=fromVault(p);
    if((idata(current).edit_operations||[]).some(x=>x.operation_id===op.op_id||x.id===op.op_id)){await Store.acknowledge(op.op_id);await receiveNote(p);continue}
    if(op.baseline!==undefined&&editTarget(current,op.body)!==op.baseline){await flagConflict(op,'This source changed while your saved edit was waiting. Review the two versions.');continue}
    result=await api(op.path,{method:'POST',body:{...op.body,expected_rev:p.rev,operation_id:op.op_id}})
   }else result=await api(op.path,{method:op.method,body:op.body});
   const p=result.note||result;if(op.kind==='note')await rememberNoteReceipt(op,prepared,p,ids);
   for(const id of ids)await Store.acknowledge(id);if(p&&p.id&&p.body_html!==undefined)await receiveNote(p)
  }catch(e){if([400,404,409,413,415,422].includes(e.status)){await flagConflict(op,e.message);continue}throw e}
 }
}

 if(op.kind==='note'){
  const result=await modal('Review saved note','<p class="help">'+esc(op.lastError||'Both saved versions are available.')+'</p><h3 class="sectionTitle">Your saved draft</h3><strong>'+esc(local.title)+'</strong><div class="summaryText">'+esc(textOf(local.body))+'</div><h3 class="sectionTitle">Current copy on Angela</h3><strong>'+esc(current&&current.title||'No current copy')+'</strong><div class="summaryText">'+esc(current?textOf(current.body):'This note is no longer available on Angela.')+'</div><label class="field" for="resolution">How to keep your changes</label><select id="resolution" class="fieldSelect" name="resolution"><option value="copy">Keep both as separate notes</option>'+(current&&!p.deleted?'<option value="apply">Apply my saved draft to this note</option>':'')+'</select>','Resolve');if(!result)return;

   if(S.note&&S.note.id===latest.id){S.note.serverBase=latest.serverBase;S.note.serverRev=latest.serverRev;S.note.localStatus=latest.localStatus;renderDetail()}toast('Your saved draft is queued for this note.')
  }
 }else{
  const value=op.body.text||op.body.name||op.body.question||(op.body.template?templateName(op.body.template):JSON.stringify(op.body)),now=current&&op.kind==='edit'?editTarget(current,op.body):null;
  const d=await modal('Review saved change','<p class="help">'+esc(op.lastError||'The source has changed.')+'</p><h3 class="sectionTitle">Your saved change</h3><div class="summaryText">'+esc(value)+'</div>'+(now!=null?'<h3 class="sectionTitle">Current value</h3><div class="summaryText">'+esc(now)+'</div>':'')+'<label class="field" for="resolution">How to continue</label><select id="resolution" class="fieldSelect" name="resolution"><option value="copy">Keep this text in My notes</option>'+(current?'<option value="retry">Apply to the current source</option>':'')+'</select>','Resolve');if(!d)return;
  if(d.resolution==='copy'){const n=await Store.get(K.note(local.id));n.body=safeHtml(n.body)+plainHtml('Saved change: '+value);n.updatedAt=Date.now();n.needsSync=!n.archiveOnly;n.localStatus='';await persist(n);if(n.needsSync)await Store.enqueue(noteOperation(n));await Store.acknowledge(op.op_id);if(S.note&&S.note.id===n.id)enterNote(n,'notes')}
  else{const updates={conflict:false,lastError:null};if(op.kind==='edit')updates.baseline=editTarget(current,op.body);if(['ask','generate'].includes(op.kind))updates.body={...op.body,request_id:uid()};await Store.updateOp(op.op_id,updates);local.localStatus='Saved change queued';await persist(local);if(S.note&&S.note.id===local.id){S.note.localStatus=local.localStatus;renderDetail()}}
 }
 scheduleSync()
}

 if(M.recorder&&M.recorder.state==='recording')M.recorder.stop();await M.chunkDone;M.stream.getTracks().forEach(t=>t.stop());clearInterval(M.tick);if(M.wakeLock)M.wakeLock.release().catch(()=>{});
 try{
  if(M.unsavedBlob){await Media.put(M.unsavedBlob);M.unsavedBlob=null;M.storageError=null}
  if(!await saveNote()){M.stopping=false;renderRecordClock();return}
  const id=M.noteId,n=S.note&&S.note.id===id?clone(S.note):await Store.get(K.note(id));if(!n)throw new Error('The recording note could not be read');
  n.metadata.meeting.ended_at=Date.now();n.metadata.meeting.duration_ms=total;n.metadata.meeting.status='transcribing';n.captureActive=false;n.finishPending=true;n.finishPayload={auto_generate:false,expected_chunks:M.nextIndex-1,duration_ms:total};n.autoAfter=M.nextIndex>1&&S.settings.autoGenerate!==false;n.localStatus=M.nextIndex>1?'Saved; waiting to transcribe':'No audio captured';n.updatedAt=Date.now();await persist(n);
  if(S.note&&S.note.id===id)S.note=n;await queueFinish(n);S.record=null;renderDetail('transcript');scheduleSync();toast('Recording saved. You can leave this note while it processes.',5000)
 }catch(e){M.stopping=false;toast('The microphone has stopped. Keep this page open, free storage, then press Stop to finish saving.',8000);renderRecordClock()}
}
async function queueFinish(n){const ops=await Store.pendingOps();if(!ops.some(x=>x.kind==='finish'&&x.note_id===n.id))await Store.enqueue({kind:'finish',note_id:n.id,method:'POST',path:'/v1/notes/'+encodeURIComponent(n.id)+'/meeting/finish',body:n.finishPayload,autoAfter:!!n.autoAfter,template:n.startPayload&&n.startPayload.template||mdata(n).template||'general'});if(n.autoAfter&&!ops.some(x=>x.kind==='generate'&&x.note_id===n.id))await Store.enqueue({kind:'generate',note_id:n.id,method:'POST',path:'/v1/notes/'+encodeURIComponent(n.id)+'/intelligence/generate',body:{template:n.startPayload&&n.startPayload.template||mdata(n).template||'general',request_id:'capture-'+n.id}})}
async function processMedia(){if(S.mediaBusy)return;S.mediaBusy=true;try{const all=await Media.list().catch(()=>[]);for(const item of all.filter(x=>x.complete&&!x.uploaded)){const pending=await Store.pendingOps();if(pending.some(x=>x.note_id===item.noteId&&['start','note'].includes(x.kind)))continue;const full=await Media.get(item.id);if(!full||!full.blob)continue;try{const result=await api('/v1/notes/'+encodeURIComponent(item.noteId)+'/meeting/audio/'+item.index+'?start_ms='+Math.round(item.startMs),{method:'POST',raw:true,body:full.blob,contentType:full.mime,timeout:310000});if(!result.ok)throw new Error('Audio was not acknowledged');full.uploaded=true;full.uploadError=null;await Media.put(full);if(result.note)await receiveNote(result.note);if(!item.keepAudio)await Media.put({...full,blob:null})}catch(e){full.uploadError='Transcription failed; audio retained for retry';await Media.put(full);const n=await Store.get(K.note(item.noteId));if(n){n.localStatus='Audio saved; retry transcription';await persist(n);if(S.note&&S.note.id===n.id){S.note.localStatus=n.localStatus;renderDetail()}}break}}}finally{S.mediaBusy=false}}
async function markRecording(note=''){if(!S.note)return;const id=S.note.id,m=mdata(),active=S.record&&S.record.noteId===id,elapsedMs=active?elapsed():S.audio&&S.audio.noteId===id?S.audio.startMs+$('audio').currentTime*1000:0;if(!S.note.metadata||S.note.metadata.kind!=='meeting'){toast('Add this context in My notes.');return}const x={id:uid(),elapsed_ms:Math.round(elapsedMs),note:note||'',created_at:Date.now()};S.note.localHighlights=[...(S.note.localHighlights||[]),x];await persist(S.note);await Store.enqueue({kind:'highlight',note_id:id,method:'POST',path:'/v1/notes/'+encodeURIComponent(id)+'/meeting/highlight',body:x});if(S.section==='highlights')renderHighlights();scheduleSync();toast('Marked '+fmt(elapsedMs))}
async function playableChunks(n){const local=await Media.list(n.id).catch(()=>[]),map=new Map();for(const x of mdata(n).audio_chunks||[])if(x.retained&&x.status==='ready')map.set(x.index,{index:x.index,startMs:x.start_ms||0,durationMs:Math.max(0,(x.end_ms||0)-(x.start_ms||0)),mime_type:x.mime_type,remote:true});for(const x of local)if(x.complete&&x.hasAudio)map.set(x.index,{...x,local:true});return Array.from(map.values()).sort((a,b)=>a.index-b.index)}
async function updatePlayerAvailability(id){try{const n=await Store.get(K.note(id));if(!n)return;const chunks=await playableChunks(n);if(!S.note||S.note.id!==id||S.record)return;$('player').hidden=!chunks.length;const duration=mdata(n).duration_ms||Math.max(0,...chunks.map(x=>x.startMs+(x.durationMs||0)));$('seek').max=String(Math.max(1,duration/1000))}catch(e){if(S.note&&S.note.id===id)$('player').hidden=true}}
function stopPlayback(){const a=$('audio');a.pause();a.removeAttribute('src');if(S.audio&&S.audio.url)URL.revokeObjectURL(S.audio.url);S.audio=null;$('play').innerHTML=svg('play');$('play').setAttribute('aria-label','Play audio')}
async function playAt(ms=0,requestedIndex){if(!S.note)return;const id=S.note.id,n=clone(S.note);try{const chunks=await playableChunks(n);if(!chunks.length){toast('Audio was not retained for this note.');return}const chosen=(requestedIndex&&chunks.find(x=>x.index===requestedIndex))||chunks.filter(x=>x.startMs<=ms).pop()||chunks[0];if(S.audio&&S.audio.noteId===id&&S.audio.index===chosen.index){$('audio').currentTime=Math.max(0,(ms-chosen.startMs)/1000);await $('audio').play();return}const local=chosen.local?await Media.get(chosen.id):null,blob=local&&local.blob||await api('/v1/notes/'+encodeURIComponent(id)+'/meeting/audio/'+chosen.index,{blob:true,timeout:20000});if(!S.note||S.note.id!==id)return;stopPlayback();const url=URL.createObjectURL(blob);S.audio={noteId:id,index:chosen.index,startMs:chosen.startMs,url,chunks};const a=$('audio');a.src=url;a.playbackRate=+$('playSpeed').value;await new Promise((resolve,reject)=>{a.onloadedmetadata=resolve;a.onerror=()=>reject(new Error('This audio could not be played.'));a.load()});if(!S.note||S.note.id!==id){stopPlayback();return}a.currentTime=Math.max(0,Math.min((ms-chosen.startMs)/1000,Number.isFinite(a.duration)?Math.max(0,a.duration-.01):Infinity));await a.play()}catch(e){toast(e.message||'Audio playback is unavailable.',5000)}}
function audioPosition(){return S.audio?S.audio.startMs+($('audio').currentTime||0)*1000:0}

function renderExport(n,format='md',onlySummary=false){const md=format==='md',lines=[],head=(s,level=2)=>lines.push((md?'#'.repeat(level)+' ':'')+s,'');head(noteName(n),1);if(!onlySummary){head('My notes');lines.push(textOf(n.body),'');const sources=mdata(n).segments||[];if(sources.length){head('Transcript');for(const x of sources)lines.push((x.start_ms!=null?'['+fmt(x.start_ms)+'] ':'')+(x.speaker_label?x.speaker_label+': ':'')+x.text);lines.push('')}const highlights=[...(mdata(n).highlights||[]),...(n.localHighlights||[])];if(highlights.length){head('Highlights');for(const x of highlights)lines.push(fmt(x.elapsed_ms)+' '+(x.note||'Marked moment'));lines.push('')}}for(const s of onlySummary?[summarySelected()].filter(Boolean):summaries(n)){head(s.title||templateName(s.template));const c=s.content||{};lines.push(c.summary||'','');for(const [label,key] of [['Key points','key_points'],['Decisions','decisions'],['Action items','action_items'],['Open questions','open_questions'],['Risks','risks'],['Follow-ups','follow_ups']]){if(!(c[key]||[]).length)continue;head(label,3);for(const x of c[key])lines.push((key==='action_items'?(x.completed?'[x] ':'[ ] '):'- ')+(x.text||x.task||'')+(x.owner?' · '+x.owner:'')+(x.due?' · '+x.due:'')+((x.citations||[]).length?' ['+x.citations.join(', ')+']':''));lines.push('')}}return lines.join('\n').trim()+'\n'}
function fileName(n){return(noteName(n).normalize('NFKC').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'-').trim().slice(0,100)||'R1-note')}
function download(name,data,type='text/plain;charset=utf-8'){const blob=data instanceof Blob?data:new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Export prepared. Check Downloads.');closeSheet()}
async function copyText(){if(!S.note)return;if(!await saveNote())return;const value=renderExport(S.note,'txt',S.section==='summary');try{await navigator.clipboard.writeText(value);toast('Copied')}catch(e){await modal('Copy note','<textarea class="fieldArea" name="copy" readonly>'+esc(value)+'</textarea><p class="help">Select and copy the text above.</p>','Done')}closeSheet()}
function srtExport(n){const stamp=ms=>{const v=Math.max(0,Math.floor(ms||0)),sec=Math.floor(v/1000);return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec/60)%60).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')+','+String(v%1000).padStart(3,'0')};return(mdata(n).segments||[]).filter(x=>Number.isFinite(x.start_ms)&&Number.isFinite(x.end_ms)&&x.end_ms>x.start_ms).map((x,i)=>(i+1)+'\n'+stamp(x.start_ms)+' --> '+stamp(x.end_ms)+'\n'+(x.speaker_label?x.speaker_label+': ':'')+x.text+'\n').join('\n')}
async function exportSheet(){if(!S.note)return;if(!await saveNote())return;const n=clone(S.note),root=showSheet('Export note');root.append(rowButton('Complete note · Markdown',()=>download(fileName(n)+'.md',renderExport(n),'text/markdown;charset=utf-8')),rowButton('Complete note · Text',()=>download(fileName(n)+'.txt',renderExport(n,'txt'))));if(summaries(n).length)root.append(rowButton('Current summary · Markdown',()=>download(fileName(n)+'-summary.md',renderExport(n,'md',true),'text/markdown;charset=utf-8')));if(srtExport(n))root.append(rowButton('Transcript · Subtitles',()=>download(fileName(n)+'.srt',srtExport(n),'application/x-subrip')));const chunks=await playableChunks(n);if(S.note&&S.note.id===n.id&&chunks.length)root.append(rowButton('Original audio chunks',()=>audioExports(n,chunks),String(chunks.length)))}
function audioExtension(mime){const type=String(mime).toLowerCase().split(';')[0];return ({'audio/wav':'wav','audio/x-wav':'wav','audio/wave':'wav','audio/mpeg':'mp3','audio/mp3':'mp3','audio/mp4':'m4a','audio/x-m4a':'m4a','video/mp4':'mp4','audio/ogg':'ogg','audio/webm':'webm','video/webm':'webm','audio/aac':'aac','audio/flac':'flac','audio/x-flac':'flac'})[type]||'audio'}
function audioExports(n,chunks){const root=showSheet('Original audio');for(const x of chunks)root.append(rowButton('Chunk '+x.index,async()=>{try{const local=x.local?await Media.get(x.id):null,blob=local&&local.blob||await api('/v1/notes/'+encodeURIComponent(n.id)+'/meeting/audio/'+x.index,{blob:true,timeout:25000}),ext=audioExtension(blob.type||local&&local.mime||x.mime_type||'');download(fileName(n)+'-'+String(x.index).padStart(3,'0')+'.'+ext,blob)}catch(e){toast('Could not fetch this audio. Cached audio remains available.')}},fmt(x.startMs)))}
async function backup(){const notes=[];for(const row of S.index){const n=await Store.get(K.note(row.id));if(n)notes.push(n)}const settings={...S.settings};delete settings.syncCursor;const payload={schema:3,app:'R1 Notes',exportedAt:Date.now(),folders:S.folders,settings,notes};download('R1-Notes-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(payload,null,2),'application/json');toast('Note backup prepared. Export retained audio separately.',5500)}
async function restoreLegacy(){const d=await inputDialog('Paste a legacy backup','',true,'This merges notes and preserves existing notes.');if(!d||!d.value.trim())return;try{let parsed;try{parsed=JSON.parse(d.value)}catch(e){parsed=JSON.parse(decodeURIComponent(escape(atob(d.value.trim()))))}await mergeBackup(parsed)}catch(e){toast('This backup could not be read. Existing notes are unchanged.',6000)}}
async function mergeBackup(data){if(!data||!Array.isArray(data.notes)||data.notes.length>5000)throw new Error('Invalid backup');let imported=0;for(const incoming of data.notes){if(!incoming||typeof incoming.id!=='string'||typeof incoming.body!=='string')continue;const existing=await Store.get(K.note(incoming.id));if(existing&&existing.updatedAt>=incoming.updatedAt)continue;const n=clone(incoming);n.body=safeHtml(n.body);if(existing){n.id=uid();n.serverBase=null;n.serverRev=0;n.title=(n.title||'Untitled note')+' (restored copy)'}n.updatedAt=Date.now();n.readOnly=false;n.archiveOnly=!!(n.metadata&&(n.metadata.kind==='meeting'||n.metadata.intelligence));n.localStatus=n.archiveOnly?'Restored archive on this device':'';n.needsSync=!n.archiveOnly;await persist(n);if(!n.archiveOnly)await Store.enqueue(noteOperation(n));imported++}for(const f of data.folders||[])if(f&&typeof f.id==='string'&&typeof f.name==='string'&&!S.folders.some(x=>x.id===f.id))S.folders.push({id:f.id,name:f.name.slice(0,100)});await Store.set(K.folders,S.folders);renderLibrary();closeSheet();toast(imported+' notes restored. Existing notes were preserved.',5000);scheduleSync()}
async function reconcile(){
 let ops=await Store.pendingOps();for(const row of S.index){const n=await Store.get(K.note(row.id));if(!n||n.archiveOnly)continue;
  if(n.needsStart&&!ops.some(x=>x.kind==='start'&&x.note_id===n.id)&&n.startPayload)await Store.enqueue({kind:'start',note_id:n.id,method:'POST',path:'/v1/meetings/start',body:n.startPayload});
  if(n.needsSync&&!ops.some(x=>x.kind==='note'&&x.note_id===n.id))await Store.enqueue(noteOperation(n));
  if(n.finishPending)await queueFinish(n)
 }
 try{
  const media=await Media.list(),interrupted=new Map();
  for(const info of media){if(!info.complete){const item=await Media.get(info.id);if(item&&item.blob&&item.blob.size){item.complete=true;item.recovered=true;await Media.put(item)}}if(!info.uploaded)interrupted.set(info.noteId,0)}
  for(const row of S.index){const n=await Store.get(K.note(row.id));if(n&&n.captureActive)interrupted.set(n.id,0)}
  for(const [id] of interrupted){const n=await Store.get(K.note(id));if(!n||n.finishPending)continue;const chunks=media.filter(x=>x.noteId===id),duration=Math.max(mdata(n).duration_ms||0,...chunks.map(x=>x.startMs+(x.durationMs||0))),count=Math.max(0,...chunks.map(x=>x.index),...(mdata(n).audio_chunks||[]).map(x=>x.index));
   n.localStatus=count?'Recovered audio; ready to retry':'Interrupted before audio was saved';n.captureActive=false;n.finishPending=true;n.autoAfter=count>0&&S.settings.autoGenerate!==false;n.finishPayload={auto_generate:false,expected_chunks:count,duration_ms:duration};n.metadata.meeting.duration_ms=duration;n.metadata.meeting.ended_at=n.metadata.meeting.ended_at||Date.now();await persist(n);await queueFinish(n)
  }
 }catch(e){/* Text notes remain usable if this WebView cannot store audio. */}
}
function wheelTarget(){if(!$('dialog').hidden)return $('dialogBody');if(!$('sheet').hidden)return $('sheet');if(S.view==='editor')return $('editScroll');return S.view==='searchView'?$('results'):$('list')}
function hardware(){for(const [name,direction] of [['scrollUp',-1],['scrollDown',1]])window.addEventListener(name,()=>wheelTarget().scrollBy({top:direction*58,behavior:'auto'}));window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!$('dialog').hidden)closeModal(false);else if(!$('sheet').hidden)closeSheet();else if(S.view==='editor')back()}if(e.key==='Tab'&&!$('dialog').hidden){const focus=Array.from($('dialog').querySelectorAll('button,input,textarea,select')).filter(x=>!x.disabled&&!x.hidden),first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});}
function bind(){setIcons();$('folders').onclick=folders;$('new').onclick=newNote;$('meetingNew').onclick=()=>recordingDialog();$('search').onclick=()=>{showView('searchView');$('q').value='';searchNotes()};$('searchBack').onclick=()=>{showView('library');renderLibrary()};$('q').oninput=searchNotes;$('back').onclick=back;$('keyboard').onclick=keyboard;$('more').onclick=noteOptions;$('sectionSelect').onchange=()=>{saveNote();renderDetail($('sectionSelect').value);$('editScroll').scrollTop=0};$('noteTitle').oninput=dirty;$('body').oninput=dirty;$('body').onchange=dirty;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.folder=b.dataset.filter;renderLibrary()});$('closeSheet').onclick=closeSheet;$('scrim').onclick=()=>{$('dialog').hidden?closeSheet():closeModal(false)};$('dialogCancel').onclick=()=>closeModal(false);$('dialogClose').onclick=()=>closeModal(false);$('dialogOk').onclick=()=>closeModal(true);$('pause').onclick=togglePause;$('stop').onclick=stopRecording;$('mark').onclick=()=>markRecording();$('audioImport').onchange=()=>{const file=$('audioImport').files[0];$('audioImport').value='';if(file)recordingDialog(file)};$('backupImport').onchange=async()=>{const file=$('backupImport').files[0];$('backupImport').value='';if(!file)return;try{if(file.size>25*1024*1024)throw new Error('Backup too large');await mergeBackup(JSON.parse(await file.text()))}catch(e){toast('Could not read this backup. Existing notes remain saved.',6000)}};$('play').onclick=()=>{if(S.audio){if($('audio').paused)$('audio').play().catch(()=>toast('Playback unavailable'));else $('audio').pause()}else playAt(+$('seek').value*1000)};$('rewind').onclick=()=>playAt(Math.max(0,audioPosition()-15000));$('forward').onclick=()=>playAt(audioPosition()+15000);$('seek').onchange=()=>playAt(+$('seek').value*1000);$('playSpeed').onchange=()=>{$('audio').playbackRate=+$('playSpeed').value};$('audio').onplay=()=>{$('play').innerHTML=svg('pause');$('play').setAttribute('aria-label','Pause audio')};$('audio').onpause=()=>{$('play').innerHTML=svg('play');$('play').setAttribute('aria-label','Play audio')};$('audio').ontimeupdate=()=>{const ms=audioPosition();$('playTime').textContent=fmt(ms);$('seek').value=String(ms/1000);for(const el of $('transcriptPane').querySelectorAll('.segment'))el.classList.toggle('playing',+el.dataset.start<=ms&&+el.dataset.end>ms)};$('audio').onended=()=>{if(!S.audio)return;const next=S.audio.chunks.find(x=>x.index>S.audio.index);if(next)playAt(next.startMs,next.index)};window.addEventListener('online',()=>syncNow(false));document.addEventListener('visibilitychange',()=>{if(document.hidden){saveNote();if(S.record&&S.record.recorder&&S.record.recorder.state==='recording')S.record.recorder.requestData()}else scheduleSync()});window.addEventListener('beforeunload',e=>{if(S.record||S.dirty){e.preventDefault();e.returnValue=''}});hardware()}
async function init(){try{S.index=await Store.recover(meta);S.folders=await Store.get(K.folders)||[];S.conversations=await Store.get(K.conversations)||[];S.settings={...S.settings,...(await Store.get(K.settings)||{})};applySettings();bind();await reconcile();renderLibrary();scheduleSync();setInterval(()=>syncNow(false),60000)}catch(e){setIcons();$('list').innerHTML='<div class="empty"><h2>Saved notes need attention</h2><p>The app could not read its storage. Existing data has not been cleared.</p><button id="retryInit" class="button">Try again</button></div>';$('retryInit').onclick=()=>location.reload();toast('Storage could not be opened. No notes were deleted.',6500)}}
init();
})();
