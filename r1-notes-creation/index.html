<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6f4ee">
<title>R1 Notes</title>
<style>
:root{--bg:#f6f4ee;--paper:#fff;--ink:#171717;--muted:#73706a;--line:#dedbd3;--accent:#e85b23;--danger:#b42318;--fs:15px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:var(--fs)}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none}.app{width:240px;height:282px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;display:none;flex-direction:column}.view.on{display:flex}.top{height:42px;flex:0 0 42px;display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--paper)}
.title{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;font-size:20px}.ib:active,.tool:active,.row:active,.menurow:active{background:rgba(0,0,0,.07)}.new{color:var(--accent);font-size:25px}
.list{overflow:auto;flex:1;background:var(--paper);scrollbar-width:none}.list::-webkit-scrollbar,.editScroll::-webkit-scrollbar{display:none}.row{width:100%;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);display:block;min-height:57px}.rowt{display:flex;align-items:center;gap:4px;font-weight:650;font-size:15px}.rowt span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}.preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.meta{color:var(--muted);font-size:10px;margin-top:2px}.empty{margin:auto;text-align:center;padding:20px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:4px}.status{font-size:10px;color:var(--muted);min-width:38px;text-align:center}
.searchbar{height:42px;display:flex;align-items:center;gap:5px;padding:5px;background:var(--paper);border-bottom:1px solid var(--line)}.searchbar input{min-width:0;flex:1;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--bg);outline:none}
.editScroll{overflow:auto;flex:1;background:var(--paper);padding:8px 10px 58px}.noteTitle{width:100%;border:0;outline:0;background:transparent;font-size:21px;font-weight:750;padding:2px 0 7px}.body{min-height:160px;outline:0;line-height:1.38;white-space:normal}.body:empty:before{content:"Start typing...";color:#aaa}.body h2{font-size:18px;margin:.35em 0}.body ul{padding-left:20px}.body .check{display:flex;align-items:flex-start;gap:6px;margin:4px 0}.body .check input{margin-top:3px}.body .check span{flex:1;min-width:0}
.tools{position:absolute;bottom:0;left:0;right:0;height:48px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:3px}.tool{height:38px;min-width:35px;border-radius:7px;font-weight:700;font-size:15px}.tool.wide{font-size:12px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:20}.sheet{position:absolute;z-index:21;left:5px;right:5px;bottom:5px;max-height:250px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px}.grab{width:34px;height:3px;background:#c6c3bc;border-radius:3px;margin:1px auto 6px}.sheethead{display:flex;align-items:center;padding:3px 5px 6px;font-weight:700}.sheethead span{flex:1}.textbtn{color:var(--accent);font-weight:650}.menurow{width:100%;min-height:38px;padding:7px 8px;text-align:left;border-top:1px solid var(--line);display:flex;align-items:center;gap:5px}.menurow span:first-child{flex:1}.danger{color:var(--danger)}.settingsrow{display:flex;align-items:center;min-height:42px;padding:5px 8px;border-top:1px solid var(--line)}.settingsrow label{flex:1}.settingsrow select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.modal{position:absolute;inset:10px;z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:8px;display:flex;flex-direction:column}.modal h3{margin:0 0 5px}.modal textarea,.modal input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px;outline:none}.modal textarea{flex:1;resize:none;font-size:10px}.actions{display:flex;justify-content:flex-end;gap:5px;margin-top:6px}.btn{min-height:32px;padding:5px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.toast{position:absolute;z-index:50;left:50%;bottom:56px;transform:translateX(-50%);background:#222;color:#fff;border-radius:6px;padding:5px 8px;font-size:11px;max-width:210px;text-align:center}
[hidden]{display:none!important}html[data-theme="dark"]{--bg:#161616;--paper:#202020;--ink:#f5f4f1;--muted:#aaa7a0;--line:#3a3936;--accent:#ff7440;--danger:#ff6b63}html[data-theme="dark"] .ib:active,html[data-theme="dark"] .tool:active,html[data-theme="dark"] .row:active,html[data-theme="dark"] .menurow:active{background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<div class="app">
<section id="library" class="view on">
  <header class="top"><button class="ib" id="folders" aria-label="Folders">&#9776;</button><div class="title" id="libTitle">Notes</div><button class="ib" id="search" aria-label="Search">&#8981;</button><button class="ib new" id="new" aria-label="New note">+</button></header>
  <div id="list" class="list"></div><div id="empty" class="empty" hidden><b>No notes yet</b>Tap + to create one.</div>
</section>
<section id="searchView" class="view">
  <div class="searchbar"><button class="ib" id="searchBack">&#8249;</button><input id="q" type="search" placeholder="Search notes" autocomplete="off"></div>
  <div id="results" class="list"></div><div id="noResults" class="empty" hidden><b>No matches</b>Try another word.</div>
</section>
<section id="editor" class="view">
  <header class="top"><button class="ib" id="back">&#8249;</button><div class="status" id="saveState">Saved</div><div class="title"></div><button class="ib" id="more">&#8226;&#8226;&#8226;</button></header>
  <div class="editScroll" id="editScroll"><input id="noteTitle" class="noteTitle" placeholder="Title" autocomplete="off"><div id="body" class="body" contenteditable="true" role="textbox" aria-multiline="true"></div></div>
  <nav class="tools"><button class="tool" data-cmd="bold"><b>B</b></button><button class="tool" data-cmd="italic"><i>I</i></button><button class="tool" data-cmd="formatBlock" data-value="h2">H</button><button class="tool" data-cmd="insertUnorderedList">&#8226;&#8801;</button><button class="tool wide" id="checkBtn">&#9745;</button></nav>
</section>
<div id="scrim" class="scrim" hidden></div>
<aside id="folderSheet" class="sheet" hidden><div class="grab"></div><div class="sheethead"><span>Folders</span><button class="textbtn" id="addFolder">New</button></div><div id="folderList"></div><button class="menurow" id="settings"><span>Settings</span><span>&rsaquo;</span></button></aside>
<aside id="moreSheet" class="sheet" hidden><div class="grab"></div><button class="menurow" id="pin"><span>Pin note</span><span>&#9734;</span></button><button class="menurow" id="move"><span>Move to folder</span><span>&rsaquo;</span></button><button class="menurow" id="copy"><span>Copy text</span><span>&#10697;</span></button><button class="menurow danger" id="trash"><span>Move to Trash</span><span>&#9003;</span></button></aside>
<aside id="moveSheet" class="sheet" hidden><div class="grab"></div><div class="sheethead"><span>Move to</span></div><div id="moveList"></div></aside>
<aside id="settingsSheet" class="sheet" hidden><div class="grab"></div><div class="sheethead"><span>Settings</span></div><div class="settingsrow"><label>Text size</label><select id="fontSize"><option value="14">Small</option><option value="15">Medium</option><option value="17">Large</option></select></div><div class="settingsrow"><label>Theme</label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><button class="menurow" id="backup"><span>Backup all notes</span><span>&rsaquo;</span></button><button class="menurow" id="restore"><span>Restore backup</span><span>&rsaquo;</span></button></aside>
<div id="modal" class="modal" hidden><h3 id="modalTitle">Input</h3><input id="modalInput" hidden><textarea id="modalText" hidden></textarea><div class="actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="okModal">OK</button></div></div>
<div id="toast" class="toast" hidden></div>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),E={lib:$("library"),searchView:$("searchView"),editor:$("editor"),list:$("list"),empty:$("empty"),results:$("results"),noResults:$("noResults"),libTitle:$("libTitle"),title:$("noteTitle"),body:$("body"),save:$("saveState"),scrim:$("scrim"),folderSheet:$("folderSheet"),moreSheet:$("moreSheet"),moveSheet:$("moveSheet"),settingsSheet:$("settingsSheet"),folderList:$("folderList"),moveList:$("moveList"),q:$("q"),fontSize:$("fontSize"),theme:$("theme"),modal:$("modal"),modalTitle:$("modalTitle"),modalInput:$("modalInput"),modalText:$("modalText"),toast:$("toast"),editScroll:$("editScroll")};
const K={index:"r1notes:index:v2",folders:"r1notes:folders:v2",settings:"r1notes:settings:v2",note:id=>"r1notes:note:"+id,prev:id=>"r1notes:note:"+id+":prev",pending:id=>"r1notes:note:"+id+":pending"};
const fallback={async getItem(k){return localStorage.getItem(k)},async setItem(k,v){localStorage.setItem(k,v)},async removeItem(k){localStorage.removeItem(k)}};
const area=()=>window.creationStorage&&window.creationStorage.plain&&window.creationStorage.plain.getItem?window.creationStorage.plain:fallback;
const enc=v=>btoa(unescape(encodeURIComponent(JSON.stringify(v)))),dec=v=>JSON.parse(decodeURIComponent(escape(atob(v))));
async function get(k){const r=await area().getItem(k);if(!r)return null;try{return dec(r)}catch(e){try{return JSON.parse(r)}catch(_){return null}}}
async function set(k,v){await area().setItem(k,enc(v))} async function del(k){await area().removeItem(k)}
let S={index:[],folders:[],settings:{theme:"system",fontSize:15},folder:"all",note:null,timer:null,sheet:null};
const uid=()=>crypto&&crypto.randomUUID?crypto.randomUUID():"n-"+Date.now()+"-"+Math.random().toString(16).slice(2);
const now=()=>Date.now(); function strip(h){const d=document.createElement("div");d.innerHTML=h||"";return(d.textContent||"").replace(/\s+/g," ").trim()}
function meta(n){return{id:n.id,title:n.title,preview:strip(n.body).slice(0,90),folderId:n.folderId||null,pinned:!!n.pinned,trashed:!!n.trashed,createdAt:n.createdAt,updatedAt:n.updatedAt}}
function label(n){return(n.title||strip(n.body).slice(0,35)||"New Note").trim()} function rel(t){let m=Math.floor((Date.now()-t)/60000);if(m<1)return"now";if(m<60)return m+"m";let h=Math.floor(m/60);if(h<24)return h+"h";let d=Math.floor(h/24);return d<7?d+"d":new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function view(v){[E.lib,E.searchView,E.editor].forEach(x=>x.classList.toggle("on",x===v));closeSheet()}
function toast(s){clearTimeout(toast.t);E.toast.textContent=s;E.toast.hidden=false;toast.t=setTimeout(()=>E.toast.hidden=true,1300)}
function openSheet(el){closeSheet();S.sheet=el;E.scrim.hidden=false;el.hidden=false} function closeSheet(){if(S.sheet)S.sheet.hidden=true;S.sheet=null;E.scrim.hidden=true}
function apply(){const th=S.settings.theme||"system";document.documentElement.dataset.theme=th==="system"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):th;document.documentElement.style.setProperty("--fs",(S.settings.fontSize||15)+"px");E.fontSize.value=String(S.settings.fontSize||15);E.theme.value=th}
async function init(){S.index=await get(K.index)||[];S.folders=await get(K.folders)||[];S.settings=Object.assign(S.settings,await get(K.settings)||{});apply();await recover();renderFolders();await render();bind();hardware()}
async function recover(){let changed=false;for(const m of S.index){const p=await get(K.pending(m.id)),c=await get(K.note(m.id));if(p&&(!c||(p.updatedAt||0)>(c.updatedAt||0))){await set(K.note(m.id),p);Object.assign(m,meta(p));changed=true}if(p)await del(K.pending(m.id))}if(changed)await set(K.index,S.index)}
async function render(){let items=S.index.filter(m=>S.folder==="trash"?m.trashed:!m.trashed&&(S.folder==="all"||S.folder==="pinned"&&m.pinned||S.folder==="unfiled"&&!m.folderId||m.folderId===S.folder));items.sort((a,b)=>(+b.pinned-+a.pinned)||(b.updatedAt-a.updatedAt));E.libTitle.textContent=S.folder==="all"?"Notes":S.folder==="pinned"?"Pinned":S.folder==="trash"?"Trash":S.folder==="unfiled"?"Unfiled":(S.folders.find(f=>f.id===S.folder)||{}).name||"Notes";rows(E.list,items,S.folder==="trash");E.empty.hidden=!!items.length;renderFolders()}
function rows(root,items,trash){root.innerHTML="";for(const m of items){const b=document.createElement("button");b.className="row";b.innerHTML='<div class="rowt"><span></span><span></span></div><div class="preview"></div><div class="meta"></div>';b.children[0].children[0].textContent=m.title||"New Note";b.children[0].children[1].textContent=m.pinned?"*":"";b.children[1].textContent=m.preview||(trash?"Deleted note":"No additional text");b.children[2].textContent=(trash?"Deleted ":"Edited ")+rel(m.updatedAt);b.onclick=()=>open(m.id);root.appendChild(b)}}
function renderFolders(){const items=[["all","All Notes"],["pinned","Pinned"],["unfiled","Unfiled"],...S.folders.map(f=>[f.id,f.name]),["trash","Trash"]];E.folderList.innerHTML="";for(const [id,name] of items){const b=document.createElement("button");b.className="menurow";b.innerHTML="<span></span><span>&rsaquo;</span>";b.firstChild.textContent=name;b.onclick=async()=>{S.folder=id;closeSheet();view(E.lib);await render()};E.folderList.appendChild(b)}E.moveList.innerHTML="";for(const [id,name] of [["", "Unfiled"],...S.folders.map(f=>[f.id,f.name])]){const b=document.createElement("button");b.className="menurow";b.innerHTML="<span></span><span>&rsaquo;</span>";b.firstChild.textContent=name;b.onclick=async()=>{if(!S.note)return;S.note.folderId=id||null;dirty();await save(true);closeSheet();toast("Moved")};E.moveList.appendChild(b)}}
async function create(){const t=now(),n={id:uid(),title:"",body:"",folderId:["all","pinned","trash","unfiled"].includes(S.folder)?null:S.folder,pinned:false,trashed:false,createdAt:t,updatedAt:t};S.note=n;S.index.unshift(meta(n));await set(K.note(n.id),n);await set(K.index,S.index);enter(n);setTimeout(()=>E.title.focus(),30)}
async function open(id){let n=await get(K.note(id));if(!n)n=await get(K.prev(id));if(!n){toast("Could not recover note");return}S.note=n;enter(n)}
function enter(n){E.title.value=n.title||"";E.body.innerHTML=n.body||"";E.save.textContent="Saved";view(E.editor);E.editScroll.scrollTop=0}
function capture(){if(!S.note)return;S.note.title=E.title.value;S.note.body=E.body.innerHTML;S.note.updatedAt=now()}
function dirty(){capture();E.save.textContent="Saving";clearTimeout(S.timer);S.timer=setTimeout(()=>save(false),350)}
async function save(force){if(!S.note)return;capture();const n=S.note;try{await set(K.pending(n.id),n);const old=await get(K.note(n.id));if(old)await set(K.prev(n.id),old);await set(K.note(n.id),n);await del(K.pending(n.id));const i=S.index.findIndex(x=>x.id===n.id);if(i>=0)S.index[i]=meta(n);else S.index.unshift(meta(n));await set(K.index,S.index);E.save.textContent="Saved";if(force)await render()}catch(e){E.save.textContent="Retry";toast("Save failed; recovery copy kept")}}
async function back(){await save(true);if(S.note&&!S.note.title&&!strip(S.note.body)){const id=S.note.id;S.index=S.index.filter(x=>x.id!==id);await del(K.note(id));await del(K.prev(id));await del(K.pending(id));await set(K.index,S.index)}S.note=null;view(E.lib);await render()}
function doSearch(){const q=E.q.value.trim().toLowerCase();const items=!q?[]:S.index.filter(m=>!m.trashed&&((m.title||"")+" "+(m.preview||"")).toLowerCase().includes(q)).sort((a,b)=>b.updatedAt-a.updatedAt);rows(E.results,items,false);E.noResults.hidden=!q||!!items.length}
function dialog(title,mode,value=""){return new Promise(resolve=>{E.modalTitle.textContent=title;E.modal.hidden=false;E.scrim.hidden=false;E.modalInput.hidden=mode!=="input";E.modalText.hidden=mode!=="text";const el=mode==="input"?E.modalInput:E.modalText;el.value=value;setTimeout(()=>el.focus(),30);const done=v=>{E.modal.hidden=true;E.scrim.hidden=true;$("okModal").onclick=null;$("cancelModal").onclick=null;resolve(v)};$("okModal").onclick=()=>done(el.value);$("cancelModal").onclick=()=>done(null)})}
async function addFolder(){const name=(await dialog("New folder","input","")||"").trim();if(!name)return;S.folders.push({id:uid(),name});await set(K.folders,S.folders);renderFolders();toast("Folder added")}
async function trash(){if(!S.note)return;if(S.note.trashed){S.note.trashed=false;dirty();await save(true);closeSheet();toast("Restored")}else{S.note.trashed=true;dirty();await save(true);closeSheet();S.note=null;view(E.lib);await render();toast("Moved to Trash")}}
async function pin(){if(!S.note)return;S.note.pinned=!S.note.pinned;dirty();await save(true);closeSheet();toast(S.note.pinned?"Pinned":"Unpinned")}
async function copy(){if(!S.note)return;const text=(S.note.title?S.note.title+"\n\n":"")+strip(S.note.body);try{await navigator.clipboard.writeText(text);toast("Copied")}catch(e){toast("Copy unavailable")}closeSheet()}
function checklist(){E.body.focus();const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0),wrap=document.createElement("div");wrap.className="check";wrap.contentEditable="false";wrap.innerHTML='<input type="checkbox"><span contenteditable="true">Checklist item</span>';r.deleteContents();r.insertNode(wrap);const sp=wrap.querySelector("span"),nr=document.createRange();nr.selectNodeContents(sp);nr.collapse(false);s.removeAllRanges();s.addRange(nr);dirty()}
async function backup(){const notes=[];for(const m of S.index){const n=await get(K.note(m.id));if(n)notes.push(n)}const payload=enc({schema:2,exportedAt:now(),folders:S.folders,settings:S.settings,notes});const v=await dialog("Backup - copy this text","text",payload);if(v!==null){try{await navigator.clipboard.writeText(payload);toast("Backup copied")}catch(e){toast("Select and copy the backup")}}}
async function restore(){const raw=await dialog("Paste backup","text","");if(!raw)return;try{const d=dec(raw.trim());if(!Array.isArray(d.notes))throw 0;for(const n of d.notes)await set(K.note(n.id),n);S.index=d.notes.map(meta);S.folders=d.folders||[];S.settings=Object.assign(S.settings,d.settings||{});await set(K.index,S.index);await set(K.folders,S.folders);await set(K.settings,S.settings);apply();renderFolders();await render();closeSheet();toast("Backup restored")}catch(e){toast("Invalid backup")}}
function bind(){$("folders").onclick=()=>openSheet(E.folderSheet);$("new").onclick=create;$("search").onclick=()=>{view(E.searchView);E.q.value="";rows(E.results,[],false);E.noResults.hidden=true;setTimeout(()=>E.q.focus(),30)};$("searchBack").onclick=()=>view(E.lib);E.q.oninput=doSearch;$("back").onclick=back;$("more").onclick=()=>{if(!S.note)return;$("pin").firstChild.textContent=S.note.pinned?"Unpin note":"Pin note";$("trash").firstChild.textContent=S.note.trashed?"Restore note":"Move to Trash";openSheet(E.moreSheet)};E.scrim.onclick=closeSheet;E.title.oninput=dirty;E.body.oninput=dirty;E.body.addEventListener("change",dirty);document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{E.body.focus();document.execCommand(b.dataset.cmd,false,b.dataset.value||null);dirty()});$("checkBtn").onclick=checklist;$("addFolder").onclick=addFolder;$("settings").onclick=()=>openSheet(E.settingsSheet);$("pin").onclick=pin;$("move").onclick=()=>openSheet(E.moveSheet);$("copy").onclick=copy;$("trash").onclick=trash;E.fontSize.onchange=async()=>{S.settings.fontSize=+E.fontSize.value;apply();await set(K.settings,S.settings)};E.theme.onchange=async()=>{S.settings.theme=E.theme.value;apply();await set(K.settings,S.settings)};$("backup").onclick=backup;$("restore").onclick=restore;document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.note)save(false)})}
function hardware(){const target=()=>document.querySelector(".view.on .list")||document.querySelector(".view.on .editScroll");window.addEventListener("scrollUp",()=>{const t=target();if(t)t.scrollBy({top:-55,behavior:"smooth"})});window.addEventListener("scrollDown",()=>{const t=target();if(t)t.scrollBy({top:55,behavior:"smooth"})})}
init();
})();
</script>
</body>
</html>
